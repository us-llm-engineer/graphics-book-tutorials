ircle><circle cx="169.6" cy="548.5" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"><title>divergence 0.23 MP: speedup 0.49</title></circle><circle cx="204.6" cy="550.8" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"><title>divergence 0.33 MP: speedup 0.47</title></circle><circle cx="293.8" cy="535.3" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"><title>divergence 0.59 MP: speedup 0.59</title></circle><circle cx="408.4" cy="531.7" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"><title>divergence 0.92 MP: speedup 0.62</title></circle><circle cx="587.5" cy="521.1" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"><title>divergence 1.44 MP: speedup 0.70</title></circle><circle cx="806.3" cy="518.3" r="4" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"><title>divergence 2.07 MP: speedup 0.72</title></circle><text x="504.5" y="496.9" font-size="11" text-anchor="start" class="sub">divergence limit β_mk/β_wf = 0.80</text><polyline fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" points="107.27,596.59 124.55,590.04 141.82,584.81 159.09,580.54 176.36,576.99 193.64,573.99 210.91,571.42 228.18,569.20 245.45,567.26 262.73,565.55 280.00,564.03 297.27,562.67 314.55,561.45 331.82,560.35 349.09,559.34 366.36,558.42 383.64,557.59 400.91,556.81 418.18,556.10 435.45,555.44 452.73,554.83 470.00,554.26 487.27,553.73 504.55,553.23 521.82,552.77 539.09,552.33 556.36,551.92 573.64,551.53 590.91,551.16 608.18,550.82 625.45,550.49 642.73,550.18 660.00,549.88 677.27,549.60 694.55,549.33 711.82,549.08 729.09,548.83 746.36,548.60 763.64,548.38 780.91,548.16 798.18,547.96 "/><rect x="89.7" y="597.7" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="93.7" y="596.9" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="99.2" y="593.6" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="115.2" y="588.2" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="137.4" y="583.6" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="166.1" y="570.7" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="201.1" y="569.7" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="290.3" y="565.6" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="404.9" y="550.1" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="584.0" y="549.0" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><rect x="802.8" y="543.7" width="7.0" height="7.0" fill="var(--bg)" stroke="var(--s3)" stroke-width="2"></rect><text x="504.5" y="564.4" font-size="11" text-anchor="start" class="sub">cornell limit β_mk/β_wf = 0.57</text><text x="24.0" y="668.0" font-size="11" text-anchor="start" class="sub">Model: T_arm(P) = α + β P. α collects per-frame fixed costs (launches, scans, host synchronisation per bounce); β is the cost per pixel.</text><text x="24.0" y="683.0" font-size="11" text-anchor="start" class="sub">The speedup S(P) = (α_m + β_m P)/(α_w + β_w P) tends to β_m/β_w.</text><text x="24.0" y="698.0" font-size="11" text-anchor="start" class="sub">Both asymptotes are below 1: even with infinitely many pixels to hide fixed costs the wavefront's per-pixel work (state read/write, classification,</text><text x="24.0" y="713.0" font-size="11" text-anchor="start" class="sub">compaction) exceeds the megakernel's, so more resolution cannot rescue it.</text></svg>
