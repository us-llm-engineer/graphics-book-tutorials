<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" role="img" aria-labelledby="t d"><title id="t">Path survival</title><desc id="d">Fraction of paths still alive after each bounce for three scenes with geometric tail fits.</desc><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}text{font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--ink)}.sub{fill:var(--ink2)}</style><rect width="900" height="688" fill="var(--bg)"/><text x="24.0" y="32.0" font-size="18" text-anchor="start" font-weight="600">By bounce 8 at most 1.0% of paths are still alive, so wavefront queues drain</text><text x="24.0" y="53.0" font-size="12" text-anchor="start" class="sub">S_k = fraction of paths that trace a ray at bounce k = (E_k - E_(k-1)) / N from extension-ray counts at depth caps; 320x180, 8 spp</text><line x1="90.0" y1="436.9" x2="650.0" y2="436.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="440.9" font-size="11" text-anchor="end" class="sub">0.0001</text><line x1="90.0" y1="360.9" x2="650.0" y2="360.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="364.9" font-size="11" text-anchor="end" class="sub">0.001</text><line x1="90.0" y1="284.9" x2="650.0" y2="284.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="288.9" font-size="11" text-anchor="end" class="sub">0.01</text><line x1="90.0" y1="208.9" x2="650.0" y2="208.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="212.9" font-size="11" text-anchor="end" class="sub">0.1</text><line x1="90.0" y1="132.9" x2="650.0" y2="132.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="136.9" font-size="11" text-anchor="end" class="sub">1</text><line x1="177.5" y1="110.0" x2="177.5" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="282.5" y1="110.0" x2="282.5" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="387.5" y1="110.0" x2="387.5" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="492.5" y1="110.0" x2="492.5" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="597.5" y1="110.0" x2="597.5" y2="490.0" stroke="var(--grid)" stroke-width="1"/><text x="177.5" y="508.0" font-size="11" text-anchor="middle" class="sub">3</text><text x="282.5" y="508.0" font-size="11" text-anchor="middle" class="sub">6</text><text x="387.5" y="508.0" font-size="11" text-anchor="middle" class="sub">9</text><text x="492.5" y="508.0" font-size="11" text-anchor="middle" class="sub">12</text><text x="597.5" y="508.0" font-size="11" text-anchor="middle" class="sub">15</text><line x1="90.0" y1="490.0" x2="650.0" y2="490.0" stroke="var(--ink2)" stroke-width="1"/><text x="370.0" y="528.0" font-size="12" text-anchor="middle" class="sub">bounce k</text><text x="44.0" y="300.0" font-size="12" text-anchor="middle" class="sub" transform="rotate(-90.0 44.0 300.0)">S_k (log scale)</text><polyline fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="107.50,143.56 142.50,166.93 177.50,222.33 212.50,255.97 247.50,288.87 282.50,321.81 317.50,355.77 352.50,388.76 387.50,419.09 422.50,444.12 "/><circle cx="107.5" cy="143.6" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="142.5" cy="166.9" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="177.5" cy="222.3" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="212.5" cy="256.0" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="247.5" cy="288.9" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="282.5" cy="321.8" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="317.5" cy="355.8" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="352.5" cy="388.8" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="387.5" cy="419.1" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="422.5" cy="444.1" r="3.5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><polyline fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4" points="212.50,257.93 247.50,289.78 282.50,321.63 317.50,353.48 352.50,385.33 387.50,417.19 422.50,449.04 "/><rect x="680.00" y="126.00" width="12.00" height="12.00" rx="2" fill="var(--s1)" fill-opacity="1"/><text x="698.0" y="137.0" font-size="13" text-anchor="start" font-weight="600">cornell</text><text x="698.0" y="156.0" font-size="11" text-anchor="start" class="sub">tail ratio r = 0.381 per bounce</text><text x="698.0" y="172.0" font-size="11" text-anchor="start" class="sub">mean rays per path 2.18</text><text x="698.0" y="188.0" font-size="11" text-anchor="start" class="sub">S_1 = 0.72  (primary hit rate)</text><polyline fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="107.50,143.75 142.50,171.06 177.50,198.73 212.50,215.84 247.50,230.43 282.50,249.87 317.50,265.71 352.50,284.63 387.50,299.91 422.50,316.70 457.50,332.95 492.50,347.79 527.50,361.81 562.50,377.20 597.50,390.29 632.50,403.94 "/><circle cx="107.5" cy="143.7" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="142.5" cy="171.1" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="177.5" cy="198.7" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="212.5" cy="215.8" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="247.5" cy="230.4" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="282.5" cy="249.9" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="317.5" cy="265.7" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="352.5" cy="284.6" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="387.5" cy="299.9" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="422.5" cy="316.7" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="457.5" cy="332.9" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="492.5" cy="347.8" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="527.5" cy="361.8" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="562.5" cy="377.2" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="597.5" cy="390.3" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><circle cx="632.5" cy="403.9" r="3.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"/><polyline fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4" points="212.50,218.51 247.50,234.37 282.50,250.22 317.50,266.07 352.50,281.92 387.50,297.77 422.50,313.62 457.50,329.47 492.50,345.32 527.50,361.18 562.50,377.03 597.50,392.88 632.50,408.73 "/><rect x="680.00" y="210.00" width="12.00" height="12.00" rx="2" fill="var(--s2)" fill-opacity="1"/><text x="698.0" y="221.0" font-size="13" text-anchor="start" font-weight="600">divergence</text><text x="698.0" y="240.0" font-size="11" text-anchor="start" class="sub">tail ratio r = 0.619 per bounce</text><text x="698.0" y="256.0" font-size="11" text-anchor="start" class="sub">mean rays per path 2.38</text><text x="698.0" y="272.0" font-size="11" text-anchor="start" class="sub">S_1 = 0.72  (primary hit rate)</text><polyline fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="107.50,147.59 142.50,200.40 177.50,281.75 212.50,337.14 247.50,394.98 282.50,442.38 "/><circle cx="107.5" cy="147.6" r="3.5" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="142.5" cy="200.4" r="3.5" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="177.5" cy="281.8" r="3.5" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="212.5" cy="337.1" r="3.5" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="247.5" cy="395.0" r="3.5" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><circle cx="282.5" cy="442.4" r="3.5" fill="var(--s3)" stroke="var(--bg)" stroke-width="2"/><polyline fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4" points="212.50,338.88 247.50,391.50 282.50,444.12 "/><rect x="680.00" y="294.00" width="12.00" height="12.00" rx="2" fill="var(--s3)" fill-opacity="1"/><text x="698.0" y="305.0" font-size="13" text-anchor="start" font-weight="600">trianglehv</text><text x="698.0" y="324.0" font-size="11" text-anchor="start" class="sub">tail ratio r = 0.203 per bounce</text><text x="698.0" y="340.0" font-size="11" text-anchor="start" class="sub">mean rays per path 1.78</text><text x="698.0" y="356.0" font-size="11" text-anchor="start" class="sub">S_1 = 0.64  (primary hit rate)</text><text x="625.5" y="467.1" font-size="11" text-anchor="end" class="sub">dashed: geometric fit S_k = S_0 r^k, k ≥ 4</text><text x="24.0" y="585.0" font-size="11" text-anchor="start" class="sub">Each Lambertian bounce either terminates (miss, emitter, depth cap) or survives Russian roulette with probability q = clamp(max throughput, 0.05,</text><text x="24.0" y="600.0" font-size="11" text-anchor="start" class="sub">0.95) from depth 3, so the tail is geometric.</text><text x="24.0" y="615.0" font-size="11" text-anchor="start" class="sub">In the wavefront the active queue at bounce k has N S_k entries: late passes launch few threads, so fixed per-pass costs (launch, scan, host</text><text x="24.0" y="630.0" font-size="11" text-anchor="start" class="sub">synchronisation) are amortised over ever fewer paths.</text><text x="24.0" y="645.0" font-size="11" text-anchor="start" class="sub">The megakernel keeps those threads resident and lets finished lanes idle; this occupancy decay is one concrete reason the wavefront loses at modest</text><text x="24.0" y="660.0" font-size="11" text-anchor="start" class="sub">path counts. Points with fewer than 30 counted rays (S_k N &lt; 30) are omitted.</text></svg>
