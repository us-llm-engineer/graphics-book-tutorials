nt-size="12" text-anchor="end" font-weight="600">log2 leaves</text><text x="640.0" y="500.0" font-size="12" text-anchor="end" font-weight="600">SAH cost</text><text x="850.0" y="500.0" font-size="12" text-anchor="end" font-weight="600">leaves by size 1/2/3/4</text><rect x="90.00" y="513.00" width="12.00" height="12.00" rx="2" fill="var(--s1)" fill-opacity="1"/><text x="108.0" y="524.0" font-size="12" text-anchor="start">cornell</text><text x="260.0" y="524.0" font-size="12" text-anchor="end">10</text><text x="350.0" y="524.0" font-size="12" text-anchor="end">7</text><text x="430.0" y="524.0" font-size="12" text-anchor="end">3</text><text x="540.0" y="524.0" font-size="12" text-anchor="end">2.0</text><text x="640.0" y="524.0" font-size="12" text-anchor="end">7.5</text><text x="850.0" y="524.0" font-size="12" text-anchor="end">1 / 1 / 1 / 1</text><rect x="90.00" y="537.00" width="12.00" height="12.00" rx="2" fill="var(--s2)" fill-opacity="1"/><text x="108.0" y="548.0" font-size="12" text-anchor="start">divergence</text><text x="260.0" y="548.0" font-size="12" text-anchor="end">903</text><text x="350.0" y="548.0" font-size="12" text-anchor="end">563</text><text x="430.0" y="548.0" font-size="12" text-anchor="end">10</text><text x="540.0" y="548.0" font-size="12" text-anchor="end">8.1</text><text x="640.0" y="548.0" font-size="12" text-anchor="end">8.6</text><text x="850.0" y="548.0" font-size="12" text-anchor="end">3 / 98 / 20 / 161</text><rect x="90.00" y="561.00" width="12.00" height="12.00" rx="2" fill="var(--s3)" fill-opacity="1"/><text x="108.0" y="572.0" font-size="12" text-anchor="start">trianglehv</text><text x="260.0" y="572.0" font-size="12" text-anchor="end">115203</text><text x="350.0" y="572.0" font-size="12" text-anchor="end">67279</text><text x="430.0" y="572.0" font-size="12" text-anchor="end">18</text><text x="540.0" y="572.0" font-size="12" text-anchor="end">15.0</text><text x="640.0" y="572.0" font-size="12" text-anchor="end">29.0</text><text x="850.0" y="572.0" font-size="12" text-anchor="end">6 / 3900 / 11539 / 18195</text><text x="24.0" y="600.0" font-size="11" text-anchor="start" class="sub">SAH cost C = sum over internal nodes of SA(n)/SA(root) + sum over leaves of SA(l)/SA(root) x (primitives in l): the expected number of node and</text><text x="24.0" y="615.0" font-size="11" text-anchor="start" class="sub">primitive tests for a ray that hits the root box.</text><text x="24.0" y="630.0" font-size="11" text-anchor="start" class="sub">A tree of N leaves needs at least log2(N) levels; the measured maximum depth is a few levels above that bound, so SAH splits are close to balanced</text><text x="24.0" y="645.0" font-size="11" text-anchor="start" class="sub">while still adapting to the geometry.</text><text x="24.0" y="660.0" font-size="11" text-anchor="start" class="sub">The per-level area ratio sits near 1/2 (children are roughly half the parent's surface), the signature of good spatial splits; the root split is the</text><text x="24.0" y="675.0" font-size="11" text-anchor="start" class="sub">least even one (ratio at depth 0 is highest for divergence).</text></svg>
