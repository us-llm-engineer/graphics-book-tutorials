<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" role="img" aria-labelledby="t d"><title id="t">SIMT efficiency</title><desc id="d">Predicted and measured fraction of active lanes per warp for the megakernel and the wavefront.</desc><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}text{font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--ink)}.sub{fill:var(--ink2)}</style><rect width="900" height="670" fill="var(--bg)"/><text x="24.0" y="32.0" font-size="18" text-anchor="start" font-weight="600">Wavefront lane efficiency: +34 points on cornell, +11 on divergence, -4 on trianglehv</text><text x="24.0" y="53.0" font-size="12" text-anchor="start" class="sub">Active lanes / 32: material-mix models vs Nsight Compute thread_inst_executed_per_inst_executed (instruction-weighted)</text><line x1="90.0" y1="460.0" x2="850.0" y2="460.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="464.0" font-size="11" text-anchor="end" class="sub">0.0</text><line x1="90.0" y1="392.0" x2="850.0" y2="392.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="396.0" font-size="11" text-anchor="end" class="sub">0.2</text><line x1="90.0" y1="324.0" x2="850.0" y2="324.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="328.0" font-size="11" text-anchor="end" class="sub">0.4</text><line x1="90.0" y1="256.0" x2="850.0" y2="256.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="260.0" font-size="11" text-anchor="end" class="sub">0.6</text><line x1="90.0" y1="188.0" x2="850.0" y2="188.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="192.0" font-size="11" text-anchor="end" class="sub">0.8</text><line x1="90.0" y1="120.0" x2="850.0" y2="120.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="124.0" font-size="11" text-anchor="end" class="sub">1.0</text><text x="216.7" y="478.0" font-size="11" text-anchor="middle" class="sub">cornell</text><text x="470.0" y="478.0" font-size="11" text-anchor="middle" class="sub">divergence</text><text x="723.3" y="478.0" font-size="11" text-anchor="middle" class="sub">trianglehv</text><line x1="90.0" y1="460.0" x2="850.0" y2="460.0" stroke="var(--ink2)" stroke-width="1"/><text x="470.0" y="498.0" font-size="12" text-anchor="middle" class="sub"></text><text x="44.0" y="290.0" font-size="12" text-anchor="middle" class="sub" transform="rotate(-90.0 44.0 290.0)">fraction of 32 lanes active</text><rect x="90.00" y="86.00" width="12.00" height="12.00" rx="2" fill="var(--s1)" fill-opacity="1"/><text x="108.0" y="96.0" font-size="12" text-anchor="start">model: iid mix</text><rect x="280.00" y="86.00" width="12.00" height="12.00" rx="2" fill="var(--s2)" fill-opacity="1"/><text x="298.0" y="96.0" font-size="12" text-anchor="start">model: 16x2 tiles</text><rect x="470.00" y="86.00" width="12.00" height="12.00" rx="2" fill="var(--s3)" fill-opacity="1"/><text x="488.0" y="96.0" font-size="12" text-anchor="start">measured megakernel</text><rect x="660.00" y="86.00" width="12.00" height="12.00" rx="2" fill="var(--s4)" fill-opacity="1"/><text x="678.0" y="96.0" font-size="12" text-anchor="start">measured wavefront</text><rect x="138.67" y="290.00" width="36.00" height="170.00" rx="3" fill="var(--s1)" fill-opacity="1"><title>cornell iid model: 0.500</title></rect><text x="156.7" y="284.0" font-size="11" text-anchor="middle">0.50</text><rect x="178.67" y="151.07" width="36.00" height="308.93" rx="3" fill="var(--s2)" fill-opacity="1"><title>cornell tile model: 0.909</title></rect><text x="196.7" y="145.1" font-size="11" text-anchor="middle">0.91</text><rect x="218.67" y="329.52" width="36.00" height="130.47" rx="3" fill="var(--s3)" fill-opacity="1"><title>cornell megakernel: 0.384</title></rect><text x="236.7" y="323.5" font-size="11" text-anchor="middle">0.38</text><rect x="258.67" y="212.35" width="36.00" height="247.65" rx="3" fill="var(--s4)" fill-opacity="1"><title>cornell wavefront: 0.728</title></rect><text x="276.7" y="206.4" font-size="11" text-anchor="middle">0.73</text><text x="216.7" y="498.0" font-size="11" text-anchor="middle" class="sub">entropy 0.85 bits, 1.10 materials per warp</text><rect x="392.00" y="374.89" width="36.00" height="85.11" rx="3" fill="var(--s1)" fill-opacity="1"><title>divergence iid model: 0.250</title></rect><text x="410.0" y="368.9" font-size="11" text-anchor="middle">0.25</text><rect x="432.00" y="285.04" width="36.00" height="174.96" rx="3" fill="var(--s2)" fill-opacity="1"><title>divergence tile model: 0.515</title></rect><text x="450.0" y="279.0" font-size="11" text-anchor="middle">0.51</text><rect x="472.00" y="368.09" width="36.00" height="91.91" rx="3" fill="var(--s3)" fill-opacity="1"><title>divergence megakernel: 0.270</title></rect><text x="490.0" y="362.1" font-size="11" text-anchor="middle">0.27</text><rect x="512.00" y="330.85" width="36.00" height="129.15" rx="3" fill="var(--s4)" fill-opacity="1"><title>divergence wavefront: 0.380</title></rect><text x="530.0" y="324.8" font-size="11" text-anchor="middle">0.38</text><text x="470.0" y="498.0" font-size="11" text-anchor="middle" class="sub">entropy 1.91 bits, 1.94 materials per warp</text><rect x="645.33" y="321.76" width="36.00" height="138.24" rx="3" fill="var(--s1)" fill-opacity="1"><title>trianglehv iid model: 0.407</title></rect><text x="663.3" y="315.8" font-size="11" text-anchor="middle">0.41</text><rect x="685.33" y="141.25" width="36.00" height="318.75" rx="3" fill="var(--s2)" fill-opacity="1"><title>trianglehv tile model: 0.937</title></rect><text x="703.3" y="135.3" font-size="11" text-anchor="middle">0.94</text><rect x="725.33" y="382.54" width="36.00" height="77.46" rx="3" fill="var(--s3)" fill-opacity="1"><title>trianglehv megakernel: 0.228</title></rect><text x="743.3" y="376.5" font-size="11" text-anchor="middle">0.23</text><rect x="765.33" y="397.43" width="36.00" height="62.57" rx="3" fill="var(--s4)" fill-opacity="1"><title>trianglehv wavefront: 0.184</title></rect><text x="783.3" y="391.4" font-size="11" text-anchor="middle">0.18</text><text x="723.3" y="498.0" font-size="11" text-anchor="middle" class="sub">entropy 1.07 bits, 1.07 materials per warp</text><text x="24.0" y="552.0" font-size="11" text-anchor="start" class="sub">Materials seen by a warp: if the 32 lanes drew materials independently with probabilities p_i, the expected number of distinct branches is E[K] =</text><text x="24.0" y="567.0" font-size="11" text-anchor="start" class="sub">sum_i (1 - (1-p_i)^32), and serialised execution gives efficiency 1/E[K].</text><text x="24.0" y="582.0" font-size="11" text-anchor="start" class="sub">Real warps are spatially coherent (a 16x2 pixel tile usually sees one or two materials), so the tile estimate sits well above the iid bound. Primary</text><text x="24.0" y="597.0" font-size="11" text-anchor="start" class="sub">hits only; secondary bounces decohere further.</text><text x="24.0" y="612.0" font-size="11" text-anchor="start" class="sub">The measured megakernel efficiency is far below the material-only estimate because BVH traversal runs a different number of iterations per lane; the</text><text x="24.0" y="627.0" font-size="11" text-anchor="start" class="sub">wavefront does not remove that (kernel_extend stays divergent), and on trianglehv, where traversal dominates the run time, it ends up no better than</text><text x="24.0" y="642.0" font-size="11" text-anchor="start" class="sub">the megakernel.</text></svg>
