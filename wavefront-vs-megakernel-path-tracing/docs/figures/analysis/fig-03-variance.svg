 246.80,490.00 252.40,490.00 258.00,490.00 263.60,490.00 269.20,490.00 274.80,490.00 280.40,490.00 286.00,490.00 291.60,490.00 297.20,489.96 302.80,489.79 308.40,489.55 314.00,489.26 319.60,488.92 325.20,488.54 330.80,488.11 336.40,487.65 342.00,487.15 347.60,486.63 353.20,486.08 358.80,485.50 364.40,484.89 370.00,484.25 375.60,483.59 381.20,482.90 386.80,482.19 392.40,481.45 398.00,480.69 403.60,479.91 409.20,479.11 414.80,478.28 420.40,477.43 426.00,476.56 431.60,475.67 437.20,474.75 442.80,473.81 448.40,472.85 454.00,471.87 459.60,470.86 465.20,469.83 470.80,468.78 476.40,467.70 482.00,466.61 487.60,465.49 493.20,464.34 498.80,463.18 504.40,461.99 510.00,460.77 515.60,459.53 521.20,458.26 526.80,456.96 532.40,455.64 538.00,454.29 543.60,452.91 549.20,451.50 554.80,450.06 560.40,448.58 566.00,447.08 571.60,445.54 577.20,443.96 582.80,442.35 588.40,440.69 594.00,438.99 599.60,437.24 605.20,435.43 610.80,433.57 616.40,431.63 622.00,429.61 627.60,427.50 633.20,425.28 638.80,422.88 644.40,420.23 650.00,110.00 "/><rect x="680.00" y="274.00" width="12.00" height="12.00" rx="2" fill="var(--s3)" fill-opacity="1"/><text x="698.0" y="285.0" font-size="13" text-anchor="start" font-weight="600">trianglehv</text><text x="698.0" y="304.0" font-size="11" text-anchor="start" class="sub">Gini 0.906, top 1% = 81.6%</text><text x="698.0" y="320.0" font-size="11" text-anchor="start" class="sub">max/mean 6614, kurtosis 10301</text><text x="24.0" y="565.0" font-size="11" text-anchor="start" class="sub">The sample variance of a pixel is σ_i^2. A Gini coefficient near 1 means almost all of the image error sits in a few pixels: bright caustic or</text><text x="24.0" y="580.0" font-size="11" text-anchor="start" class="sub">glancing-light paths (fireflies).</text><text x="24.0" y="595.0" font-size="11" text-anchor="start" class="sub">The excess kurtosis (1e2 to 1e4, against 0 for a Gaussian) shows why the mean error converges slowly even though the RMSE obeys N^(−½): a few rare,</text><text x="24.0" y="610.0" font-size="11" text-anchor="start" class="sub">very bright paths dominate the sum.</text><text x="24.0" y="625.0" font-size="11" text-anchor="start" class="sub">Practical consequence: the megakernel/wavefront comparison must be made at equal sample counts, never equal visual noise; clamping or better light</text><text x="24.0" y="640.0" font-size="11" text-anchor="start" class="sub">sampling would change the tail, not the estimator's bias law.</text></svg>
