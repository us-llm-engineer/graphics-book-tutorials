<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" role="img" aria-labelledby="t d"><title id="t">Roofline</title><desc id="d">Arithmetic intensity and floating-point throughput of every kernel against the device roofline.</desc><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}text{font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--ink)}.sub{fill:var(--ink2)}</style><rect width="900" height="653" fill="var(--bg)"/><text x="24.0" y="32.0" font-size="18" text-anchor="start" font-weight="600">95% of wavefront kernel time is left of the ridge point; the megakernel is right of it</text><text x="24.0" y="53.0" font-size="12" text-anchor="start" class="sub">divergence, 1280x720, 1 spp. FP32 peak 2764 GFLOP/s (16 SMs, 1.35 GHz), DRAM peak 192 GB/s, ridge 14 FLOP/B</text><line x1="90.0" y1="490.0" x2="650.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="494.0" font-size="11" text-anchor="end" class="sub">0.1</text><line x1="90.0" y1="409.9" x2="650.0" y2="409.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="413.9" font-size="11" text-anchor="end" class="sub">1</text><line x1="90.0" y1="329.7" x2="650.0" y2="329.7" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="333.7" font-size="11" text-anchor="end" class="sub">10</text><line x1="90.0" y1="249.6" x2="650.0" y2="249.6" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="253.6" font-size="11" text-anchor="end" class="sub">100</text><line x1="90.0" y1="169.5" x2="650.0" y2="169.5" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="173.5" font-size="11" text-anchor="end" class="sub">1000</text><line x1="90.0" y1="110.0" x2="90.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="202.0" y1="110.0" x2="202.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="314.0" y1="110.0" x2="314.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="426.0" y1="110.0" x2="426.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="538.0" y1="110.0" x2="538.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><line x1="650.0" y1="110.0" x2="650.0" y2="490.0" stroke="var(--grid)" stroke-width="1"/><text x="90.0" y="508.0" font-size="11" text-anchor="middle" class="sub">0.01</text><text x="202.0" y="508.0" font-size="11" text-anchor="middle" class="sub">0.1</text><text x="314.0" y="508.0" font-size="11" text-anchor="middle" class="sub">1</text><text x="426.0" y="508.0" font-size="11" text-anchor="middle" class="sub">10</text><text x="538.0" y="508.0" font-size="11" text-anchor="middle" class="sub">100</text><text x="650.0" y="508.0" font-size="11" text-anchor="middle" class="sub">1000</text><line x1="90.0" y1="490.0" x2="650.0" y2="490.0" stroke="var(--ink2)" stroke-width="1"/><text x="370.0" y="528.0" font-size="12" text-anchor="middle" class="sub">arithmetic intensity (FLOP per DRAM byte)</text><text x="44.0" y="300.0" font-size="12" text-anchor="middle" class="sub" transform="rotate(-90.0 44.0 300.0)">achieved GFLOP/s</text><polyline fill="none" stroke="var(--ink2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="90.00,387.21 443.77,134.12 650.00,134.12 "/><text x="449.8" y="126.1" font-size="11" text-anchor="start" class="sub">compute roof</text><text x="98.9" y="370.9" font-size="11" text-anchor="start" class="sub">memory roof (slope = DRAM bandwidth)</text><rect x="90.00" y="80.00" width="12.00" height="12.00" rx="2" fill="var(--s1)" fill-opacity="1"/><text x="108.0" y="90.0" font-size="12" text-anchor="start">megakernel</text><rect x="240.00" y="80.00" width="12.00" height="12.00" rx="2" fill="var(--s2)" fill-opacity="1"/><text x="258.0" y="90.0" font-size="12" text-anchor="start">wavefront kernels (area = share of kernel time)</text><circle cx="426.1" cy="231.3" r="17.5974" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_extend: 169.3 GFLOP/s, 10.02 FLOP/B, 38.2% of kernel time</title></circle><text x="426.1" y="235.3" font-size="11" text-anchor="middle" font-weight="600">1</text><circle cx="209.2" cy="316.7" r="12.6568" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_classify: 14.5 GFLOP/s, 0.12 FLOP/B, 15.5% of kernel time</title></circle><text x="209.2" y="320.7" font-size="11" text-anchor="middle" font-weight="600">2</text><circle cx="309.0" cy="256.7" r="11.7573" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_shade_lambert: 81.5 GFLOP/s, 0.90 FLOP/B, 12.4% of kernel time</title></circle><text x="309.0" y="260.7" font-size="11" text-anchor="middle" font-weight="600">3</text><circle cx="265.3" cy="288.4" r="10.4106" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_shade_dielectric: 32.8 GFLOP/s, 0.37 FLOP/B, 8.5% of kernel time</title></circle><text x="265.3" y="292.4" font-size="11" text-anchor="middle" font-weight="600">4</text><circle cx="397.1" cy="236.6" r="10.1675" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_shadow: 145.6 GFLOP/s, 5.52 FLOP/B, 7.9% of kernel time</title></circle><text x="397.1" y="240.6" font-size="11" text-anchor="middle" font-weight="600">5</text><circle cx="293.6" cy="275.6" r="9.28797" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_init_paths: 47.4 GFLOP/s, 0.66 FLOP/B, 5.8% of kernel time</title></circle><text x="293.6" y="279.6" font-size="11" text-anchor="middle" font-weight="600">6</text><circle cx="207.6" cy="328.6" r="9.20699" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_shade_metal: 10.3 GFLOP/s, 0.11 FLOP/B, 5.6% of kernel time</title></circle><text x="207.6" y="332.6" font-size="11" text-anchor="middle" font-weight="600">7</text><circle cx="235.2" cy="286.1" r="6.67639" fill="var(--s2)" stroke="var(--bg)" stroke-width="2"><title>kernel_finish: 35.1 GFLOP/s, 0.20 FLOP/B, 1.5% of kernel time</title></circle><circle cx="504.4" cy="244.5" r="26" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel_kernel: 115.9 GFLOP/s, 50.16 FLOP/B, 100.0% of kernel time</title></circle><text x="504.4" y="284.5" font-size="11" text-anchor="middle" class="sub">megakernel</text><text x="680.0" y="130.0" font-size="12" text-anchor="start" font-weight="600">wavefront kernels</text><text x="680.0" y="152.0" font-size="11" text-anchor="start">1  kernel_extend</text><text x="680.0" y="166.0" font-size="10" text-anchor="start" class="sub">38% of time, 169 GFLOP/s, 10.02 FLOP/B</text><text x="680.0" y="186.0" font-size="11" text-anchor="start">2  kernel_classify</text><text x="680.0" y="200.0" font-size="10" text-anchor="start" class="sub">15% of time, 15 GFLOP/s, 0.12 FLOP/B</text><text x="680.0" y="220.0" font-size="11" text-anchor="start">3  kernel_shade_lambert</text><text x="680.0" y="234.0" font-size="10" text-anchor="start" class="sub">12% of time, 82 GFLOP/s, 0.90 FLOP/B</text><text x="680.0" y="254.0" font-size="11" text-anchor="start">4  kernel_shade_dielectric</text><text x="680.0" y="268.0" font-size="10" text-anchor="start" class="sub">8% of time, 33 GFLOP/s, 0.37 FLOP/B</text><text x="680.0" y="288.0" font-size="11" text-anchor="start">5  kernel_shadow</text><text x="680.0" y="302.0" font-size="10" text-anchor="start" class="sub">8% of time, 146 GFLOP/s, 5.52 FLOP/B</text><text x="680.0" y="322.0" font-size="11" text-anchor="start">6  kernel_init_paths</text><text x="680.0" y="336.0" font-size="10" text-anchor="start" class="sub">6% of time, 47 GFLOP/s, 0.66 FLOP/B</text><text x="680.0" y="356.0" font-size="11" text-anchor="start">7  kernel_shade_metal</text><text x="680.0" y="370.0" font-size="10" text-anchor="start" class="sub">6% of time, 10 GFLOP/s, 0.11 FLOP/B</text><text x="24.0" y="550.0" font-size="11" text-anchor="start" class="sub">Roofline model: attainable P = min(P_peak, B x AI), ridge point AI* = P_peak / B. FLOP = FADD + FMUL + 2 FFMA thread instructions (contraction is</text><text x="24.0" y="565.0" font-size="11" text-anchor="start" class="sub">disabled in this build, so FFMA is rare); bytes are DRAM traffic from Nsight Compute.</text><text x="24.0" y="580.0" font-size="11" text-anchor="start" class="sub">Both roofs come from profiler counters (SM count, SM clock, DRAM bytes per cycle and DRAM clock), not from a data sheet.</text><text x="24.0" y="595.0" font-size="11" text-anchor="start" class="sub">No kernel reaches 10% of peak FLOP/s: path tracing is dominated by integer, branch and memory-latency work (intersection tests, pointer chasing),</text><text x="24.0" y="610.0" font-size="11" text-anchor="start" class="sub">which a FLOP roofline does not credit. Kernels left of AI* (classify, shading) are limited by DRAM; the wavefront's extra state traffic moves work to</text><text x="24.0" y="625.0" font-size="11" text-anchor="start" class="sub">that side.</text></svg>
