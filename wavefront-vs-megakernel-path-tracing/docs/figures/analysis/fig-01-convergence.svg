<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" role="img" aria-labelledby="t d"><title id="t">Monte Carlo convergence</title><desc id="d">RMSE of the megakernel and CPU reference against a 16384-sample reference as the sample count grows.</desc><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}text{font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--ink)}.sub{fill:var(--ink2)}</style><rect width="900" height="621" fill="var(--bg)"/><text x="24.0" y="32.0" font-size="18" text-anchor="start" font-weight="600">Error falls as N^(−½): fitted slope -0.502 for N ≥ 16 (all N: -0.476)</text><text x="24.0" y="53.0" font-size="12" text-anchor="start" class="sub">Luminance RMSE on cornell (160x90) against a 16384-spp reference, 6 seeds per point, reference noise removed</text><line x1="90.0" y1="454.2" x2="850.0" y2="454.2" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="458.2" font-size="11" text-anchor="end" class="sub">0.003</text><line x1="90.0" y1="350.0" x2="850.0" y2="350.0" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="354.0" font-size="11" text-anchor="end" class="sub">0.01</text><line x1="90.0" y1="254.9" x2="850.0" y2="254.9" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="258.9" font-size="11" text-anchor="end" class="sub">0.03</text><line x1="90.0" y1="150.7" x2="850.0" y2="150.7" stroke="var(--grid)" stroke-width="1"/><text x="82.0" y="154.7" font-size="11" text-anchor="end" class="sub">0.1</text><line x1="125.3" y1="110.0" x2="125.3" y2="470.0" stroke="var(--grid)" stroke-width="1"/><line x1="262.7" y1="110.0" x2="262.7" y2="470.0" stroke="var(--grid)" stroke-width="1"/><line x1="400.1" y1="110.0" x2="400.1" y2="470.0" stroke="var(--grid)" stroke-width="1"/><line x1="537.4" y1="110.0" x2="537.4" y2="470.0" stroke="var(--grid)" stroke-width="1"/><line x1="674.8" y1="110.0" x2="674.8" y2="470.0" stroke="var(--grid)" stroke-width="1"/><line x1="812.2" y1="110.0" x2="812.2" y2="470.0" stroke="var(--grid)" stroke-width="1"/><text x="125.3" y="488.0" font-size="11" text-anchor="middle" class="sub">1</text><text x="262.7" y="488.0" font-size="11" text-anchor="middle" class="sub">4</text><text x="400.1" y="488.0" font-size="11" text-anchor="middle" class="sub">16</text><text x="537.4" y="488.0" font-size="11" text-anchor="middle" class="sub">64</text><text x="674.8" y="488.0" font-size="11" text-anchor="middle" class="sub">256</text><text x="812.2" y="488.0" font-size="11" text-anchor="middle" class="sub">1024</text><line x1="90.0" y1="470.0" x2="850.0" y2="470.0" stroke="var(--ink2)" stroke-width="1"/><text x="470.0" y="508.0" font-size="12" text-anchor="middle" class="sub">samples per pixel N (log scale)</text><text x="44.0" y="290.0" font-size="12" text-anchor="middle" class="sub" transform="rotate(-90.0 44.0 290.0)">RMSE of luminance (log scale)</text><rect x="90.00" y="80.00" width="12.00" height="12.00" rx="2" fill="var(--s1)" fill-opacity="1"/><text x="108.0" y="90.0" font-size="12" text-anchor="start">megakernel (mean ± sd)</text><rect x="320.00" y="80.00" width="12.00" height="12.00" rx="2" fill="var(--s2)" fill-opacity="1"/><text x="338.0" y="90.0" font-size="12" text-anchor="start">CPU reference</text><rect x="550.00" y="80.00" width="12.00" height="12.00" rx="2" fill="var(--s3)" fill-opacity="1"/><text x="568.0" y="90.0" font-size="12" text-anchor="start">predicted √(mean sample variance / N)</text><polyline fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" points="125.34,136.71 812.17,436.71 "/><polyline fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="194.03,210.93 262.71,219.77 331.39,236.86 400.07,258.39 468.76,288.38 537.44,317.46 606.12,346.90 674.81,376.94 743.49,406.74 812.17,436.68 "/><line x1="125.3" y1="202.9" x2="125.3" y2="117.2" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="125.3" cy="149.9" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=1: RMSE 0.10097 +/- 0.04626</title></circle><line x1="194.0" y1="216.2" x2="194.0" y2="155.8" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="194.0" cy="180.8" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=2: RMSE 0.07058 +/- 0.02368</title></circle><line x1="262.7" y1="236.0" x2="262.7" y2="185.7" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="262.7" cy="207.2" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=4: RMSE 0.05204 +/- 0.01471</title></circle><line x1="331.4" y1="238.8" x2="331.4" y2="224.3" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="331.4" cy="231.3" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=8: RMSE 0.03942 +/- 0.00329</title></circle><line x1="400.1" y1="267.0" x2="400.1" y2="245.2" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="400.1" cy="255.4" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=16: RMSE 0.02982 +/- 0.00373</title></circle><line x1="468.8" y1="295.0" x2="468.8" y2="280.4" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="468.8" cy="287.4" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=32: RMSE 0.02061 +/- 0.00173</title></circle><line x1="537.4" y1="320.3" x2="537.4" y2="313.4" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="537.4" cy="316.8" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=64: RMSE 0.01468 +/- 0.00059</title></circle><line x1="606.1" y1="349.5" x2="606.1" y2="344.3" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="606.1" cy="346.9" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=128: RMSE 0.01037 +/- 0.00031</title></circle><line x1="674.8" y1="380.1" x2="674.8" y2="374.5" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="674.8" cy="377.2" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=256: RMSE 0.00730 +/- 0.00024</title></circle><line x1="743.5" y1="408.1" x2="743.5" y2="405.2" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="743.5" cy="406.6" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=512: RMSE 0.00520 +/- 0.00009</title></circle><line x1="812.2" y1="438.7" x2="812.2" y2="434.8" stroke="var(--ink2)" stroke-width="1.5"/><circle cx="812.2" cy="436.7" r="5" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"><title>megakernel N=1024: RMSE 0.00367 +/- 0.00008</title></circle><rect x="120.8" y="153.9" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=1: RMSE 0.09149</title></rect><rect x="189.5" y="157.1" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=2: RMSE 0.08813</title></rect><rect x="258.2" y="184.1" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=4: RMSE 0.06456</title></rect><rect x="326.9" y="210.8" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=8: RMSE 0.04741</title></rect><rect x="395.6" y="246.6" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=16: RMSE 0.03135</title></rect><rect x="464.3" y="280.1" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=32: RMSE 0.02128</title></rect><rect x="532.9" y="308.8" width="9.0" height="9.0" fill="var(--bg)" stroke="var(--s2)" stroke-width="2"><title>CPU N=64: RMSE 0.01527</title></rect><text x="808.2" y="374.7" font-size="11" text-anchor="end" class="sub">ideal slope −½</text><text x="143.4" y="440.9" font-size="13" text-anchor="start" font-weight="600">RMSE = σ / √(N)</text><text x="24.0" y="548.0" font-size="11" text-anchor="start" class="sub">Estimator: F_N = (1/N) sum f(X_i)/p(X_i) with independent counter-based streams, so Var[F_N] = σ² / N and RMSE is proportional to N^(−½).</text><text x="24.0" y="563.0" font-size="11" text-anchor="start" class="sub">Below N = 16 the curve is flatter than −½ (heavy-tailed samples: the sample variance is itself noisy); from N = 16 the fit is -0.502 (R² 0.9999).</text><text x="24.0" y="578.0" font-size="11" text-anchor="start" class="sub">The predicted line uses only the renderer's own per-pixel variance estimate, so it checks the variance bookkeeping independently of the reference</text><text x="24.0" y="593.0" font-size="11" text-anchor="start" class="sub">image.</text></svg>
