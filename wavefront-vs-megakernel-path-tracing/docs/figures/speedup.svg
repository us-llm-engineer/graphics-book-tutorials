text x="187.7" y="272.1" font-size="14" text-anchor="middle" font-weight="600">0.46</text><text x="187.7" y="382.0" font-size="13" text-anchor="middle">cornell</text><path fill="var(--s1)" d="M365.0 360.0V248.6Q365.0 244.6 369.0 244.6H445.0Q449.0 244.6 449.0 248.6V360.0Z"><title>divergence: speedup 0.67</title></path><text x="407.0" y="236.6" font-size="14" text-anchor="middle" font-weight="600">0.67</text><text x="407.0" y="382.0" font-size="13" text-anchor="middle">divergence</text><path fill="var(--s1)" d="M584.3 360.0V245.6Q584.3 241.6 588.3 241.6H664.3Q668.3 241.6 668.3 245.6V360.0Z"><title>trianglehv: speedup 0.69</title></path><text x="626.3" y="233.6" font-size="14" text-anchor="middle" font-weight="600">0.69</text><text x="626.3" y="382.0" font-size="13" text-anchor="middle">trianglehv</text><line x1="78.0" y1="187.5" x2="736.0" y2="187.5" class="ref"/><text x="736.0" y="181.5" font-size="11" text-anchor="end" class="sub">equal time (1.00)</text><line x1="78.0" y1="135.8" x2="736.0" y2="135.8" class="ref"/><text x="736.0" y="129.8" font-size="11" text-anchor="end" class="sub">target (1.30)</text></svg>
